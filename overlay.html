<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lower Third Overlay</title><link rel="stylesheet" href="style.css">
</head>
<body class="overlay-page">
  <main class="stage">
    <section id="lowerThird" class="lower-third" aria-live="polite">
      <div class="accent"></div>
      <div class="content"><p id="tag">งานประชาสัมพันธ์ โรงเรียนเบญจมราชูทิศ</p><h1 id="name">ณัฐวุฒิ ใจดี</h1><p id="role">ผู้ดำเนินรายการ</p><div class="sparkle-layer"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div id="logoWrap" class="logo-wrap"><img id="logo" alt=""></div>
    </section>
    <aside id="countdown" class="countdown"><span>COUNTDOWN</span><strong id="timerValue">15:00</strong></aside>
    <aside id="clock" class="clock-widget" aria-live="off"><span id="clockValue">00:00:00</span></aside>
    <div id="ticker" class="ticker"><div id="tickerTrack" class="ticker-track"></div></div>
    <aside id="qr" class="qr-widget"><img id="qrImage" alt="QR Code"></aside>
    <aside id="watermark" class="watermark-widget"><img id="watermarkImage" alt="โลโก้"></aside>
  </main>
  <script type="module" src="overlay.js"></script>
</body>
</html>
